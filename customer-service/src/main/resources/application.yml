server:
  port: ${SERVER_PORT:8082}
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/customerdb}
    username: ${SPRING_DATASOURCE_USERNAME:customer}
    password: ${SPRING_DATASOURCE_PASSWORD:customer}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    open-in-view: false
security:
  oauth2:
    resourceserver:
      jwt:
        issuer-uri: ${OAUTH_ISSUER_URI:http://localhost:8085/realms/shop}
        jwk-set-uri: ${OAUTH_JWK_SET_URI:http://localhost:8085/realms/shop/protocol/openid-connect/certs}
app:
  securityDisabled: ${SECURITY_DISABLED:false}

flyway:
  enabled: true
  locations: classpath:db/migration
