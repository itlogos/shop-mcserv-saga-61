server:
  port: ${SERVER_PORT:8083}
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/orderdb}
    username: ${SPRING_DATASOURCE_USERNAME:orders}
    password: ${SPRING_DATASOURCE_PASSWORD:orders}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    open-in-view: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
security:
  oauth2:
    resourceserver:
      jwt:
        issuer-uri: ${OAUTH_ISSUER_URI:http://localhost:8085/realms/shop}
        jwk-set-uri: ${OAUTH_JWK_SET_URI:http://localhost:8085/realms/shop/protocol/openid-connect/certs}
app:
  seedOrder: ${SEED_ORDER:false}
  securityDisabled: ${SECURITY_DISABLED:false}
  storeUrl: ${STORE_SERVICE_URL:http://localhost:8081}

flyway:
  enabled: true
  locations: classpath:db/migration
