server:
  port: ${SERVER_PORT:8081}
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/storedb}
    username: ${SPRING_DATASOURCE_USERNAME:store}
    password: ${SPRING_DATASOURCE_PASSWORD:store}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    open-in-view: false
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      missing-topics-fatal: false
    consumer:
      properties:
        # чтобы не падать при временной недоступности брокера на старте
        group-id: ${spring.application.name}-group
        auto-offset-reset: earliest
        retry.backoff.ms: 1000
        reconnect.backoff.ms: 1000

  security:
    oauth2:
      resourceserver:
        jwt:
          #        issuer-uri: ${OAUTH_ISSUER_URI:http://keycloak:8080/realms/shop}
          #        jwk-set-uri: ${OAUTH_JWK_SET_URI:http://keycloak:8080/realms/shop/protocol/openid-connect/certs}
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://keycloak:8080/realms/shop/protocol/openid-connect/certs}
app:
#  securityDisabled: ${SECURITY_DISABLED:false}
  orderTopic: order.created
  orderConfirmedTopic: order.confirmed

flyway:
  enabled: true
  locations: classpath:db/migration

